<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 佐雍云仓数据中心</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <div class="login-bg" aria-hidden="true"></div>
  <div class="login-card">
    <div class="login-brand">
      <span class="login-logo">佐</span>
      <div class="login-brand-text">
        <h1>佐雍云仓数据中心</h1>
        <p>仓储 · 物流 · 数据一体化管理平台</p>
      </div>
    </div>
    <form id="loginForm">
      <label>账号<input name="username" autocomplete="username" placeholder="请输入账号" required></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required></label>
      <button type="submit" class="primary">登录</button>
      <div id="err" class="err"></div>
    </form>
    <div class="login-foot">佐雍云仓数据中心 · 内部系统，请勿外传</div>
  </div>
  <script src="js/auth.js"></script>
  <!-- 【开发环境 DEV 横幅 + 热更新】生产环境没有 /api/dev/info 端点，自动跳过 -->
  <script>
  (function () {
    fetch('/api/dev/info', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (info) {
      if (!info || !info.isDev) return;
      var banner = document.createElement('div');
      banner.id = '__dev_banner';
      banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:linear-gradient(90deg,#f59e0b,#fbbf24);color:#1f2937;font-size:12px;font-weight:600;padding:6px 16px;text-align:center;font-family:-apple-system,"Segoe UI",sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2);';
      banner.textContent = '🛠 开发模式 - 文件变更自动刷新（前端: fs.watch+SSE，后端: nodemon 自动重启）';
      banner.title = '后端文件变更会自动重启服务器，前端文件变更会自动刷新浏览器页面';
      document.body.appendChild(banner);
    }).catch(function () { /* 生产环境没有端点，静默跳过 */ });
  })();
  </script>
</body>
</html>
