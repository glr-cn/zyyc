<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>佐雍云仓数据中心</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231b2a4a'/%3E%3Ctext x='32' y='45' font-size='36' font-family='Microsoft YaHei,sans-serif' font-weight='700' fill='%23ffffff' text-anchor='middle'%3E%E4%BD%90%3C/text%3E%3C/svg%3E">
  <!-- 统一版本号：配合 Express 静态资源 Cache-Control: public, max-age=86400, immutable -->
  <!-- 版本升级时改 ?v=N → URL 变化 → 浏览器自动下载新版本（完美 cache-busting） -->
  <link rel="stylesheet" href="css/style.css?v=9">
</head>
<body>
  <div id="app" class="layout" style="display:none">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo">佐</span>
        <span class="brand-name">佐雍云仓数据中心</span>
      </div>
      <nav id="nav"></nav>
    </aside>
    <div id="mega" class="mega-panel"></div>
    <div class="main">
      <!-- 单行顶部 Header：左 Tab 标签栏 | 右 用户信息 + 退出（品牌区已移除，避免与首个 Tab 混淆） -->
      <header class="app-header">
        <div class="tabbar" id="tabbar"></div>
        <div class="user"><span id="cloudState" class="cloud-state" title="云空间状态">云空间检测中…</span><span id="uname"></span><button id="logout">退出</button></div>
      </header>
      <section class="content" id="content"></section>
    </div>
  </div>
  <!-- 云服务 SDK（CDN 全局 WorkBuddyCloud；必须先加载） -->
  <script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>

  <!-- ============================================================ -->
  <!-- 【核心脚本】首屏必须的——加 defer 让浏览器并行下载 + 不阻塞 HTML 解析 -->
  <!-- defer 脚本保证按 DOM 出现顺序执行，async 不保证，故核心脚本用 defer -->
  <!-- 统一 ?v=8：版本不变 → 浏览器 24h disk cache → 首屏 ~100ms；版本变 → 强制下载 -->
  <!-- ============================================================ -->
  <script defer src="js/api.js?v=8"></script>
  <script defer src="js/date-range-picker.js?v=7"></script>
  <script defer src="js/auth.js?v=7"></script>           <!-- 认证逻辑（tabs/app 都依赖） -->
  <script defer src="js/menu.js?v=7"></script>           <!-- 菜单渲染（sidebar/nav） -->
  <script defer src="js/_lib-lazy.js?v=7"></script>      <!-- 第三方库懒加载（xlsx/html-to-image） -->
  <script defer src="js/_page_loader.js?v=10"></script>   <!-- 重页面脚本懒加载（20+ 个 pageId 映射） -->
  <script defer src="js/tabs.js?v=7"></script>           <!-- PAGE_META 定义 + tabs 实例 -->
  <script defer src="js/app.js?v=7"></script>            <!-- 入口（登录态检查 + 初始化 tabs + 渲染菜单） -->

  <!-- ============================================================ -->
  <!-- 【重页面脚本】首次点开对应页面时才由 _page_loader.js 动态注入 -->
  <!-- 以下脚本已移至 _page_loader.js 的 MAP 中，由 tabs.open() 按需加载 -->
  <!-- cloud.js / signoff.js / customers.js / orders.js / inventory.js / workhours.js / -->
  <!-- analytics.js / dashboard.js / users.js / roles.js / logistics-quotes.js / smart-quote.js / -->
  <!-- tools-split-no.js / tools-barcode-embed.js / permission-tree.js / log-center.js / -->
  <!-- data-migration.js / menu-sort.js -->
  <!-- 动态注入时也带 ?v=7，浏览器对它也用 24h disk cache（首次加载后下次瞬开） -->
  <!-- ============================================================ -->

  <!-- ============================================================ -->
  <!-- 【第三方库】由 _lib-lazy.js 按需注入 -->
  <!-- SheetJS xlsx.full.min.js (430KB) / html-to-image.js (60KB) -->
  <!-- 用户点"下载模板/导入 Excel/导出看板图片"时才加载 -->
  <!-- CDN 库也带固定版本号：xlsx@0.18.5 / html-to-image@1.11.11 -->
  <!-- ============================================================ -->

  <!-- ============================================================ -->
  <!-- 【前端工具库】dayjs + chart.js -->
  <!-- dayjs@1.11.13 (~10KB) — 日期处理（比原生 Date 好用，全局 dayjs 可用） -->
  <!-- chart.js@4.4.7 (~80KB) — Dashboard 图表（canvas 绑 Chart 全局） -->
  <!-- 都带 defer，不阻塞首屏渲染；固定版本号 + 24h 浏览器缓存 -->
  <!-- ============================================================ -->
  <script defer src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js?v=7"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js?v=7"></script>

  <!-- ============================================================ -->
  <!-- 【开发环境热更新】检测 dev 模式 → 注入 DEV 横幅 + SSE 自动刷新 -->
  <!-- 生产环境没有 /api/dev/info 端点，fetch 404 后脚本静默跳过，零影响 -->
  <!-- ============================================================ -->
  <script>
  (function () {
    fetch('/api/dev/info', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (info) {
      if (!info || !info.isDev) return;
      // DEV 横幅
      var banner = document.createElement('div');
      banner.id = '__dev_banner';
      banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:linear-gradient(90deg,#f59e0b,#fbbf24);color:#1f2937;font-size:12px;font-weight:600;padding:6px 16px;text-align:center;font-family:-apple-system,"Segoe UI",sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;user-select:none;';
      banner.textContent = '🛠 开发模式 - 文件变更自动刷新（前端: fs.watch+SSE，后端: nodemon 自动重启）';
      banner.title = '后端文件变更会自动重启服务器，前端文件变更会自动刷新浏览器页面';
      document.body.appendChild(banner);
      document.body.style.paddingTop = '28px';
      // 连接 SSE 热更新
      try {
        var es = new EventSource('/dev/hot');
        var pendingReload = null;
        es.addEventListener('reload', function (ev) {
          var data = JSON.parse(ev.data || '{}');
          if (pendingReload) clearTimeout(pendingReload);
          pendingReload = setTimeout(function () {
            console.log('[dev:hot] 文件 ' + (data.file || '') + ' 变更，自动刷新...');
            location.reload();
          }, 100); // 给文件写入留 100ms 缓冲，避免读到半写入
        });
        es.addEventListener('connected', function (ev) {
          var data = JSON.parse(ev.data || '{}');
          console.log('[dev:hot] 热更新客户端已连接 (version=' + data.version + ')');
        });
        es.onerror = function () {
          // 后端重启期间 SSE 会断开，自动重连（EventSource 原生支持）
          console.log('[dev:hot] SSE 连接断开，等待重连...');
        };
      } catch (e) { /* EventSource 不可用时静默跳过 */ }
    }).catch(function () { /* 生产环境没有 /api/dev/info，静默跳过 */ });
  })();
  </script>
</body>
</html>
